<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CGV — Coffret AR</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f4f4;font-family:Arial,sans-serif}
model-viewer{width:100%;height:100%;background:#f4f4f4}
.title{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;background:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 2px 12px #0002;font-weight:700;white-space:nowrap}
#ar-button{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:6;border:0;border-radius:999px;padding:15px 24px;background:#111;color:#fff;font-size:16px;font-weight:700;box-shadow:0 4px 14px #0004}
</style>
</head>
<body>
<div class="title">CGV — 530 × 622 × 200 mm</div>
<model-viewer
  src="cgv_coffret.glb"
  ios-src="cgv_coffret.usdz"
  alt="Coffret CGV"
  ar
  ar-modes="scene-viewer quick-look webxr"
  camera-controls
  shadow-intensity="1"
  exposure="1">
  <button slot="ar-button" id="ar-button">📱 Voir le coffret en AR</button>
</model-viewer>
</body>
</html>
